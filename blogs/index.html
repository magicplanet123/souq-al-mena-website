<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Souq Al Mena - Blog Articles</title>
    <meta name="description" content="Explore our collection of business automation, digital marketing, and recruitment articles.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        header h1 {
            color: #1a73e8;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .blog-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .blog-card-header {
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
            padding: 20px;
            color: white;
            height: 120px;
            display: flex;
            align-items: flex-end;
        }

        .blog-card-header h2 {
            font-size: 1.3em;
            line-height: 1.3;
        }

        .blog-card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-card-meta {
            color: #999;
            font-size: 0.85em;
            margin-bottom: 12px;
        }

        .blog-card-description {
            color: #555;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .blog-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .read-more {
            background: #1a73e8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s ease;
        }

        .read-more:hover {
            background: #1557b0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .no-blogs {
            text-align: center;
            padding: 40px;
            color: #999;
            background: white;
            border-radius: 12px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .blog-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Souq Al Mena Blog</h1>
            <p>Discover insights on business automation, digital marketing, and recruitment</p>
        </header>

        <div id="blog-container" class="blog-grid">
            <div class="loading">Loading blogs...</div>
        </div>
    </div>

    <script>
        async function loadBlogs() {
            try {
                const container = document.getElementById('blog-container');
                container.innerHTML = '';

                // Fetch list of blog files from the current directory
                const response = await fetch('./');
                const html = await response.text();

                // Parse HTML to find all .html files
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'));
                const blogFiles = links
                    .map(a => a.href)
                    .filter(href => href.includes('blog_') && href.endsWith('.html'))
                    .sort()
                    .reverse(); // Latest first

                if (blogFiles.length === 0) {
                    container.innerHTML = '<div class="no-blogs">No blogs found yet. Check back soon!</div>';
                    return;
                }

                // Load and parse each blog file
                for (const blogFile of blogFiles) {
                    try {
                        const blogResponse = await fetch(blogFile);
                        const blogHtml = await blogResponse.text();

                        const blogDoc = parser.parseFromString(blogHtml, 'text/html');

                        // Extract metadata
                        const title = blogDoc.querySelector('h1')?.textContent || 'Untitled Blog';
                        const meta = blogDoc.querySelector('meta[name="description"]')?.content || 'No description';
                        const dateElement = blogDoc.querySelector('.meta')?.textContent || 'Unknown date';

                        // Create card
                        const card = document.createElement('div');
                        card.className = 'blog-card';
                        card.innerHTML = `
                            <div class="blog-card-header">
                                <h2>${title}</h2>
                            </div>
                            <div class="blog-card-content">
                                <div class="blog-card-meta">${dateElement}</div>
                                <div class="blog-card-description">${meta}</div>
                                <div class="blog-card-footer">
                                    <button class="read-more" onclick="window.open('${blogFile}', '_blank')">
                                        Read More →
                                    </button>
                                </div>
                            </div>
                        `;

                        container.appendChild(card);
                    } catch (err) {
                        console.error(`Error loading blog ${blogFile}:`, err);
                    }
                }

            } catch (err) {
                console.error('Error loading blogs:', err);
                document.getElementById('blog-container').innerHTML =
                    '<div class="no-blogs">Error loading blogs. Please try again later.</div>';
            }
        }

        // Load blogs when page loads
        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>
</html>
